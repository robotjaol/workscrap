name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install package metadata
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Upload unpacked extension
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: career-pulse-${{ github.sha }}
          path: dist/career-pulse
          if-no-files-found: error
